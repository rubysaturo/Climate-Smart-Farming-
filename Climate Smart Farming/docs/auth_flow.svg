<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>
  <style>
    .start-end { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 20; ry: 20; }
    .process { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .decision { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .line { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #000000; text-anchor: middle; }
  </style>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="white" />
  
  <!-- Title -->
  <text x="300" y="30" class="title">User Authentication Flow (Log In &amp; Sign Up)</text>
  
  <!-- Start -->
  <rect x="220" y="70" width="160" height="40" class="start-end" />
  <text x="300" y="90" class="text">START: Visit App</text>
  
  <!-- Fill Form -->
  <rect x="200" y="150" width="200" height="50" class="process" />
  <text x="300" y="175" class="text">Enter Login / Signup Info</text>
  
  <!-- Decision: Credentials Valid? -->
  <polygon points="300,230 400,270 300,310 200,270" class="decision" />
  <text x="300" y="270" class="text">Valid Info?</text>
  
  <!-- Error Toast -->
  <rect x="430" y="245" width="130" height="50" class="process" />
  <text x="495" y="270" class="text">Show Error Toast</text>
  
  <!-- Authenticate -->
  <rect x="200" y="350" width="200" height="50" class="process" />
  <text x="300" y="375" class="text">Auth User &amp; Save JWT Token</text>
  
  <!-- Decision: Role -->
  <polygon points="300,430 400,470 300,510 200,470" class="decision" />
  <text x="300" y="470" class="text">Role is Admin?</text>
  
  <!-- Admin Route -->
  <rect x="50" y="445" width="130" height="50" class="process" />
  <text x="115" y="470" class="text">Redirect to Admin UI</text>
  
  <!-- Farmer Route -->
  <rect x="420" y="445" width="130" height="50" class="process" />
  <text x="485" y="470" class="text">Redirect to Dashboard</text>
  
  <!-- End -->
  <rect x="220" y="550" width="160" height="40" class="start-end" />
  <text x="300" y="570" class="text">END: Session Active</text>
  
  <!-- Connections -->
  <!-- Start to Form -->
  <path d="M 300 110 L 300 150" class="line" />
  
  <!-- Form to Valid Decision -->
  <path d="M 300 200 L 300 230" class="line" />
  
  <!-- Decision No (Valid Info?) -->
  <path d="M 400 270 L 430 270" class="line" />
  <text x="415" y="260" class="text" style="font-size: 11px;">No</text>
  
  <!-- Error back to Form -->
  <path d="M 495 245 L 495 175 L 400 175" class="line" />
  
  <!-- Decision Yes (Valid Info?) -->
  <path d="M 300 310 L 300 350" class="line" />
  <text x="310" y="325" class="text" style="font-size: 11px;">Yes</text>
  
  <!-- Authenticate to Role Decision -->
  <path d="M 300 400 L 300 430" class="line" />
  
  <!-- Role Decision Admin = Yes -->
  <path d="M 200 470 L 180 470" class="line" />
  <text x="190" y="460" class="text" style="font-size: 11px;">Yes</text>
  
  <!-- Role Decision Admin = No -->
  <path d="M 400 470 L 420 470" class="line" />
  <text x="410" y="460" class="text" style="font-size: 11px;">No</text>
  
  <!-- Admin Route to End -->
  <path d="M 115 495 L 115 570 L 220 570" class="line" />
  
  <!-- Farmer Route to End -->
  <path d="M 485 495 L 485 570 L 380 570" class="line" />
</svg>
