<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>
  <style>
    .start-end { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 20; ry: 20; }
    .process { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .decision { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .line { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #000000; text-anchor: middle; dominant-baseline: middle; }
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #000000; text-anchor: middle; }
  </style>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="white" />
  
  <!-- Title -->
  <text x="300" y="30" class="title">Pest Alerts &amp; Soil Health Flowchart</text>
  
  <!-- Start -->
  <rect x="220" y="60" width="160" height="40" class="start-end" />
  <text x="300" y="80" class="text">START</text>
  
  <!-- Soil Sensors Read -->
  <rect x="40" y="130" width="220" height="50" class="process" />
  <text x="150" y="155" class="text">Read Soil Sensor Metrics (NPK, pH)</text>
  
  <!-- Pest Pull -->
  <rect x="340" y="130" width="220" height="50" class="process" />
  <text x="450" y="155" class="text">Pull Local Pest Infection Reports</text>
  
  <!-- Decision: Soil normal? -->
  <polygon points="150,200 220,240 150,280 80,240" class="decision" />
  <text x="150" y="240" class="text">Abnormal?</text>
  
  <!-- Decision: Pest Outbreak? -->
  <polygon points="450,200 520,240 450,280 380,240" class="decision" />
  <text x="450" y="240" class="text">Outbreak?</text>
  
  <!-- Soil Safe -->
  <rect x="30" y="320" width="100" height="45" class="process" />
  <text x="80" y="342.5" class="text">Normal Status</text>
  
  <!-- Soil Recommend -->
  <rect x="150" y="320" width="120" height="45" class="process" />
  <text x="210" y="342.5" class="text">Soil Advice (NPK/pH)</text>
  
  <!-- Pest Safe -->
  <rect x="330" y="320" width="100" height="45" class="process" />
  <text x="380" y="342.5" class="text">No Active Alert</text>
  
  <!-- Pest Alert -->
  <rect x="450" y="320" width="120" height="45" class="process" />
  <text x="510" y="342.5" class="text">Show Active Alerts</text>
  
  <!-- Display Dashboard -->
  <rect x="200" y="420" width="200" height="50" class="process" />
  <text x="300" y="445" class="text">Update Dashboard Indicators</text>
  
  <!-- End -->
  <rect x="220" y="500" width="160" height="40" class="start-end" />
  <text x="300" y="520" class="text">END</text>
  
  <!-- Connections -->
  <path d="M 220 80 L 150 80 L 150 130" class="line" />
  <path d="M 380 80 L 450 80 L 450 130" class="line" />
  
  <path d="M 150 180 L 150 200" class="line" />
  <path d="M 450 180 L 450 200" class="line" />
  
  <!-- Soil Decisions -->
  <path d="M 80 240 L 80 320" class="line" />
  <text x="65" y="270" class="text" style="font-size: 11px;">No</text>
  
  <path d="M 220 240 L 220 320" class="line" />
  <text x="235" y="270" class="text" style="font-size: 11px;">Yes</text>
  
  <!-- Pest Decisions -->
  <path d="M 380 240 L 380 320" class="line" />
  <text x="365" y="270" class="text" style="font-size: 11px;">No</text>
  
  <path d="M 520 240 L 520 320" class="line" />
  <text x="535" y="270" class="text" style="font-size: 11px;">Yes</text>
  
  <!-- Merge path from outcomes to dashboard update -->
  <path d="M 80 365 L 80 400 L 250 400 L 250 420" class="line" />
  <path d="M 210 365 L 210 400 L 270 400 L 270 420" class="line" />
  
  <path d="M 380 365 L 380 400 L 330 400 L 330 420" class="line" />
  <path d="M 510 365 L 510 400 L 350 400 L 350 420" class="line" />
  
  <path d="M 300 470 L 300 500" class="line" />
</svg>
