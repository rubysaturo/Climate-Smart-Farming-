services:
  - type: web
    name: climate-smart-farming-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn agrismart.wsgi --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*.render.com"
      - key: DATABASE_URL
        fromDatabase:
          name: climate-smart-farming-db
          property: connectionString
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.vercel.app,https://*.render.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,https://*.render.com"

  - type: postgres
    name: climate-smart-farming-db
    plan: free
    database: climate_smart_farming
